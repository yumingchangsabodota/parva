version: "3.9"

services:
  # ── Backend (FastAPI + LangGraph) ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PARVA_POSTGRES_HOST: postgres
      PARVA_POSTGRES_PORT: 5432
      PARVA_POSTGRES_USER: parva
      PARVA_POSTGRES_PASSWORD: parva
      PARVA_POSTGRES_DB: parva
      PARVA_REDIS_URL: redis://redis:6379/0
      PARVA_MINIO_ENDPOINT: minio:9000
      PARVA_MINIO_ACCESS_KEY: parva
      PARVA_MINIO_SECRET_KEY: parvasecret
      PARVA_MINIO_BUCKET: parva-files
      PARVA_LITELLM_BASE_URL: http://litellm:4000/v1
      PARVA_LITELLM_API_KEY: sk-parva-internal
      PARVA_EXECUTOR_IMAGE: parva-executor:latest
      PARVA_EXECUTOR_NETWORK: parva-net
      PARVA_EXECUTOR_WORKSPACE_BASE: /var/parva/workspaces
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Docker-in-Docker for executor
      - workspaces:/var/parva/workspaces
      - skills:/var/parva/skills
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      litellm:
        condition: service_healthy
    networks:
      - parva-net
    restart: unless-stopped

  # ── Frontend (Next.js) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - parva-net
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parva
      POSTGRES_PASSWORD: parva
      POSTGRES_DB: parva
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parva"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - parva-net
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - parva-net
    restart: unless-stopped

  # ── LiteLLM (LLM proxy) ─────────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm-database:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./infra/litellm-config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://parva:parva@postgres:5432/parva
      LITELLM_MASTER_KEY: sk-parva-internal
      # Set your LLM provider API keys here
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - parva-net
    restart: unless-stopped

  # ── Redis Commander (Redis web UI) ─────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - parva-net
    restart: unless-stopped

  # ── MinIO (S3-compatible object storage) ─────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: parva
      MINIO_ROOT_PASSWORD: parvasecret
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"  # MinIO Console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - parva-net
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  workspaces:
  skills:

networks:
  parva-net:
    name: parva-net
    driver: bridge
