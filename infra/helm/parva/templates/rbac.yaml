apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "parva.fullname" . }}-executor
  labels:
    {{- include "parva.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "parva.fullname" . }}-executor-role
  labels:
    {{- include "parva.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "parva.fullname" . }}-executor-binding
  labels:
    {{- include "parva.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "parva.fullname" . }}-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "parva.fullname" . }}-executor-role
