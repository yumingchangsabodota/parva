apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "parva.fullname" . }}-frontend
  labels:
    {{- include "parva.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "parva.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "parva.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: {{ include "parva.image" (dict "global" .Values.global "repository" .Values.frontend.image.repository "tag" .Values.frontend.image.tag) }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://{{ include "parva.fullname" . }}-backend:{{ .Values.backend.service.port }}
            - name: NEXT_PUBLIC_WS_URL
              value: ws://{{ include "parva.fullname" . }}-backend:{{ .Values.backend.service.port }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
