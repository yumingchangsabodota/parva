# -- Global settings
global:
  imageRegistry: ""  # e.g. ghcr.io/yumingchangsabodota

# -- Backend (FastAPI + LangGraph)
backend:
  replicaCount: 2
  image:
    repository: parva-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  # Executor sidecar settings
  executor:
    image:
      repository: parva-executor
      tag: latest
    workspaceBase: /var/parva/workspaces

# -- Frontend (Next.js)
frontend:
  replicaCount: 2
  image:
    repository: parva-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -- PostgreSQL
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
  auth:
    username: parva
    password: changeme-in-production
    database: parva
  storage:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# -- Redis
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  storage:
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -- Redis Commander (web UI for Redis)
redisCommander:
  enabled: true
  image:
    repository: rediscommander/redis-commander
    tag: latest
  service:
    type: ClusterIP
    port: 8081

# -- MinIO (S3-compatible object storage)
minio:
  enabled: true
  image:
    repository: minio/minio
    tag: latest
  auth:
    accessKey: parva
    secretKey: changeme-in-production
  bucket: parva-files
  storage:
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# -- LiteLLM (self-hosted LLM proxy)
litellm:
  enabled: true
  image:
    repository: ghcr.io/berriai/litellm
    tag: main-latest
  # Internal master key — auto-generated, used for backend-to-litellm auth
  masterKey: sk-parva-internal
  service:
    type: ClusterIP
    port: 4000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # Model routing — add your actual provider API keys here
  models:
    - model_name: gpt-4o
      litellm_params:
        model: openai/gpt-4o
        # api_key is set via OPENAI_API_KEY env var or secret
    - model_name: gpt-4o-mini
      litellm_params:
        model: openai/gpt-4o-mini
    - model_name: claude-sonnet-4-5-20250929
      litellm_params:
        model: anthropic/claude-sonnet-4-5-20250929
        # api_key is set via ANTHROPIC_API_KEY env var or secret
    - model_name: dall-e-3
      litellm_params:
        model: openai/dall-e-3
  # Provider API keys — set these to connect to actual LLM providers
  providerKeys:
    OPENAI_API_KEY: ""
    ANTHROPIC_API_KEY: ""
    # Add more providers as needed:
    # AZURE_API_KEY: ""
    # GOOGLE_API_KEY: ""

# -- Ingress
ingress:
  enabled: true
  className: nginx
  host: parva.example.com
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/websocket-services: "{{ .Release.Name }}-backend"
  tls: []
  #  - secretName: parva-tls
  #    hosts:
  #      - parva.example.com
