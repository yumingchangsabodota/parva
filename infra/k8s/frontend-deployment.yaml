apiVersion: apps/v1
kind: Deployment
metadata:
  name: parva-frontend
  namespace: parva
  labels:
    app: parva
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: parva
      component: frontend
  template:
    metadata:
      labels:
        app: parva
        component: frontend
    spec:
      containers:
        - name: frontend
          image: parva-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://parva-backend:8000"
            - name: NEXT_PUBLIC_WS_URL
              value: "ws://parva-backend:8000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: parva-frontend
  namespace: parva
spec:
  selector:
    app: parva
    component: frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parva-ingress
  namespace: parva
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/websocket-services: "parva-backend"
spec:
  rules:
    - host: parva.example.com  # Change to your domain
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: parva-backend
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: parva-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: parva-frontend
                port:
                  number: 3000
